version: '3.8'

services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - VITE_API_URL=${VITE_API_URL:-https://back-end-production-4645.up.railway.app}
    container_name: ecommerce-frontend
    ports:
      - "3000:8080"
    restart: unless-stopped
    environment:
      - PORT=8080
      - NODE_ENV=production
    networks:
      - ecommerce-network

networks:
  ecommerce-network:
    driver: bridge
