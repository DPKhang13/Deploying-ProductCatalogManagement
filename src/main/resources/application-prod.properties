spring.application.name=Project

# Database configuration - Railway uses DATABASE_URL environment variable
spring.datasource.url=${DATABASE_URL:jdbc:postgresql://localhost:5432/postgres}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server configuration - Railway provides PORT environment variable
server.port=${PORT:8080}

# JWT Configuration - MUST set JWT_SECRET in Railway environment variables
jwt.secret=${JWT_SECRET}
jwt.expiration=${JWT_EXPIRATION:3600000}

# CORS Configuration - Set allowed origins via environment variable
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:*}

# Logging
logging.level.root=INFO
logging.level.com.example.project=INFO
