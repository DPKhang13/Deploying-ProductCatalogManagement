spring.application.name=Project

# Database configuration (will be overridden by environment variables in docker-compose)
spring.datasource.url=jdbc:postgresql://postgres:5432/ProductCatalogManage
spring.datasource.username=postgres
spring.datasource.password=123456
spring.datasource.driver-class-name=org.postgresql.Driver

# JPA/Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect

# Server configuration
server.port=8080

# JWT Configuration
jwt.secret=${JWT_SECRET:THIS_IS_A_VERY_LONG_SECRET_KEY_256_BITS_MINIMUM_LENGTH_FOR_DOCKER_1234567890}
jwt.expiration=3600000
